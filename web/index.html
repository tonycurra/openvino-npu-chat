<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>talk</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; }
  body { font: 15px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; }
  header, footer { display: flex; gap: .5rem; align-items: center; padding: .55rem .8rem; flex-shrink: 0; }
  header { border-bottom: 1px solid #222; }
  footer { border-top: 1px solid #222; align-items: flex-end; }
  header select, header input, #in {
    background: #000; color: #eee; border: 1px solid #333; padding: .35rem .45rem; font: inherit;
  }
  #agent { flex: 1; max-width: 28rem; }
  #tokens { width: 5rem; }
  #note { margin-left: auto; color: #444; font-size: .75rem; }
  #log { flex: 1; overflow: auto; padding: 1rem .8rem 2rem; display: flex; flex-direction: column; gap: .8rem; }
  .msg { max-width: 42rem; white-space: pre-wrap; }
  .me { align-self: flex-end; color: #fff; }
  .bot { align-self: flex-start; color: #bbb; }
  .who { display: block; color: #555; font-size: .75rem; margin-bottom: .15rem; }
  .sys { align-self: center; color: #555; font-size: .8rem; }
  #in { flex: 1; resize: none; min-height: 2.4rem; max-height: 8rem; }
  button {
    background: #000; color: #eee; border: 1px solid #444; padding: .45rem .8rem;
    font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>
<header>
  <select id="agent" title="model"></select>
  <input id="tokens" type="number" min="16" max="2048" step="16" value="128" title="max new tokens">
  <span id="note"></span>
</header>
<main id="log"></main>
<footer>
  <textarea id="in" rows="1" placeholder="message"></textarea>
  <button id="send" type="button">send</button>
</footer>
<script>
const $ = id => document.getElementById(id);
let state = {}, busy = false;

function line(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function bot(text, who) {
  const d = document.createElement("div");
  d.className = "msg bot";
  if (who) {
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = who;
    d.appendChild(w);
  }
  d.appendChild(document.createTextNode(text));
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function setBusy(on) {
  busy = on;
  $("send").disabled = on;
  $("agent").disabled = on;
}

async function boot() {
  state = await (await fetch("/api/state")).json();
  for (const a of state.agents) {
    if (!a.ready) continue;
    const o = document.createElement("option");
    o.value = a.id;
    o.textContent = a.label;
    if (a.id === state.default_agent) o.selected = true;
    $("agent").appendChild(o);
  }
  if (state.default_tokens) $("tokens").value = state.default_tokens;
  $("note").textContent = "llm " + state.llm_device;
  if (!$("agent").options.length) line("no llm on disk", "sys");
}

async function send() {
  const text = $("in").value.trim();
  if (!text || busy) return;
  const agent = $("agent").value;
  const label = $("agent").selectedOptions[0].textContent;
  $("in").value = "";
  line(text, "me");
  const wait = bot("…", label);
  setBusy(true);
  const fd = new FormData();
  fd.append("agent", agent);
  fd.append("tokens", $("tokens").value);
  fd.append("text", text);
  fd.append("speak", "0");
  try {
    const r = await fetch("/api/talk", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) {
      wait.textContent = j.error || "error";
      wait.className = "msg sys";
      return;
    }
    wait.textContent = "";
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = (j.agent || label) + (j.device ? " · " + j.device : "") + (j.status ? " · " + j.status.replace(/^ok · /, "") : "");
    wait.appendChild(w);
    wait.appendChild(document.createTextNode(j.reply || ""));
  } catch (e) {
    wait.textContent = String(e);
    wait.className = "msg sys";
  } finally {
    setBusy(false);
    $("in").focus();
  }
}

$("send").onclick = send;
$("in").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
boot();
</script>
</body>
</html>
